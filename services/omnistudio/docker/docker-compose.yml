version: '3.8'

services:
  omnistudio-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: omnistudio-engine
    labels:
      com.mesajify.service.display_name: "Mesajify · Görsel & Post-Production"
      com.mesajify.service.role: "media-gateway"
    restart: unless-stopped
    ports:
      - "3456:3456"   # API Gateway (OpenAI Compatible Endpoint)
      - "6080:6080"   # noVNC Web Arayüzü (Tek seferlik giriş yapmak için)
    volumes:
      # Kodlari dogrudan bagla (Guncellemeler aninda aktif olsun)
      - ../gateway:/app/gateway
      - ./entrypoint.sh:/app/entrypoint.sh
      # Oturum cerezlerini (ChatGPT profilleri 1, 2, 3, 4) kalici olarak saklar
      - ./data/profile:/data/chromium-profile
      - ./data/profile-2:/data/chromium-profile-2
      - ./data/profile-3:/data/chromium-profile-3
      - ./data/profile-4:/data/chromium-profile-4
      # Uretilen gorselleri diskte tutar
      - ./data/outputs:/app/gateway/outputs
      # Flow Chrome profili (Google Flow oturumu)
      - ./data/profile-flow:/data/chromium-profile-flow
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=3456
      - NODE_ENV=production
      - NUM_WORKERS=4 # 4 Bagimsiz ChatGPT Hesabi
      - GFLOW_ENGINE_URL=http://gflow-engine:3461
      # Flow Chrome host'ta 9226 portunda calisiyor, container buraya erisir
      - FLOW_CDP_HOST=host.docker.internal
      - FLOW_CDP_PORT=9226
      # Keep the canonical Gemini tab plus one Flow maintenance/session tab.
      # A third short-lived auth/download tab may exist during re-authentication.
      - PREFERRED_WORKING_TABS=2
      - ABSOLUTE_TAB_CAP=3
    networks:
      - default
      - gflow-internal
    shm_size: 4gb

networks:
  gflow-internal:
    external: true
    name: infra_gflow-internal

version: '3.8'

services:
  omnistudio-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: omnistudio-engine
    restart: unless-stopped
    ports:
      - "3456:3456"   # API Gateway (OpenAI Compatible Endpoint)
      - "6080:6080"   # noVNC Web Arayüzü (Tek seferlik giriş yapmak için)
    volumes:
      # Oturum çerezlerini (ChatGPT profilleri 1, 2, 3...) kalıcı olarak saklar
      - ./data:/data
      # Üretilen görselleri diskte tutar
      - ./data/outputs:/app/gateway/outputs
    environment:
      - PORT=3456
      - NODE_ENV=production
      - NUM_WORKERS=1 # İstendiğinde 2, 3, 4 veya 5 yapılabilir
    shm_size: 4gb

# WhatsApp servisi -- solo / elle scale / autoscale / kucuk VPS
#
# Repo KOKUNDEN (bir profil secin):
#   docker compose -f infra/docker-compose.yml --profile small up -d --build   # 2–4 GB
#   docker compose -f infra/docker-compose.yml --profile solo up -d --build    # orta VPS
#   docker compose -f infra/docker-compose.yml --profile scale up -d --build   # ~32 GB / 300
#   docker compose -f infra/docker-compose.yml --profile autoscale up -d --build
#
# Autoscale actuator=docker icin scaler'a docker.sock mount gerekir;
# varsayilan SCALE_ACTUATOR=noop (yalnizca DB desired yazar).
# Docker CLI: build-arg INSTALL_DOCKER_CLI=true

x-wa-common: &wa-common
  build:
    context: ..
    dockerfile: apps/wa-service/Dockerfile
  image: wa-service:local
  env_file:
    - ../apps/wa-service/.env
  restart: unless-stopped
  mem_limit: 6g
  shm_size: '256mb'
  stop_grace_period: 45s
  init: true
  healthcheck:
    test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/health']
    interval: 30s
    timeout: 10s
    start_period: 180s
    retries: 3
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  # Orta/buyuk VPS solo worker — acik: --profile solo
  wa-service:
    <<: *wa-common
    profiles: ['solo']
    container_name: wa-service
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: oracle-1

  # Dusuk/orta VPS: tek worker, MAX_SESSIONS=50 (4 GB'de riskli; 8 GB+ daha saglikli)
  wa-service-small:
    <<: *wa-common
    profiles: ['small']
    container_name: wa-service
    mem_limit: 3.5g
    shm_size: '128mb'
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      WORKER_ID: hetzner-1
      MAX_SESSIONS: '50'
      DB_POOL_MAX: '2'
      JOB_BATCH_SIZE: '1'
      JOB_POLL_INTERVAL_MS: '3000'
      CAMPAIGN_TICK_MS: '8000'
      NODE_OPTIONS: '--max-old-space-size=2560'

  # Sabit 6 dilim (manuel)
  wa-worker-1:
    <<: *wa-common
    container_name: wa-worker-1
    profiles: ['scale']
    ports:
      - '127.0.0.1:8081:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: worker-1
      DB_POOL_MAX: '2'

  wa-worker-2:
    <<: *wa-common
    container_name: wa-worker-2
    profiles: ['scale']
    ports:
      - '127.0.0.1:8082:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: worker-2
      DB_POOL_MAX: '2'

  wa-worker-3:
    <<: *wa-common
    container_name: wa-worker-3
    profiles: ['scale']
    ports:
      - '127.0.0.1:8083:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: worker-3
      DB_POOL_MAX: '2'

  wa-worker-4:
    <<: *wa-common
    container_name: wa-worker-4
    profiles: ['scale']
    ports:
      - '127.0.0.1:8084:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: worker-4
      DB_POOL_MAX: '2'

  wa-worker-5:
    <<: *wa-common
    container_name: wa-worker-5
    profiles: ['scale']
    ports:
      - '127.0.0.1:8085:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: worker-5
      DB_POOL_MAX: '2'

  wa-worker-6:
    <<: *wa-common
    container_name: wa-worker-6
    profiles: ['scale']
    ports:
      - '127.0.0.1:8086:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: worker-6
      DB_POOL_MAX: '2'

  # --- Autoscale: scale edilebilir worker (container_name YOK) ---
  wa-worker:
    <<: *wa-common
    profiles: ['autoscale']
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: auto
      DB_POOL_MAX: '2'

  wa-scaler:
    <<: *wa-common
    container_name: wa-scaler
    profiles: ['autoscale']
    build:
      context: ..
      dockerfile: apps/wa-service/Dockerfile
      args:
        INSTALL_DOCKER_CLI: 'true'
    image: wa-service:local
    ports:
      - '127.0.0.1:8090:8080'
    working_dir: /app
    volumes:
      # docker actuator icin (SCALE_ACTUATOR=docker)
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/app/infra/docker-compose.yml:ro
    environment:
      NODE_ENV: production
      ROLE: scaler
      WORKER_ID: scaler-1
      DB_POOL_MAX: '2'
      SCALE_ACTUATOR: noop
      SCALER_MIN_WORKERS: '1'
      SCALER_MAX_WORKERS: '40'
      SCALER_CAPACITY_PER_WORKER: '50'
      SCALE_COMPOSE_FILE: /app/infra/docker-compose.yml
      SCALE_COMPOSE_SERVICE: wa-worker
      SCALE_COMPOSE_PROJECT: filo-wa
      # SCALE_ACTUATOR=docker icin CLI build-arg ile kurulur; varsayilan noop.

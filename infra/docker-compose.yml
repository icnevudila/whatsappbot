# WhatsApp servisi -- Oracle / VPS / Coolify
#
# Repo KOKUNDEN:
#   docker compose -f infra/docker-compose.yml up -d --build
#
# Tek worker (varsayilan): wa-service, WORKER_ID=oracle-1, port 8080
# Coklu worker (300 hat olcegi):
#   docker compose -f infra/docker-compose.yml --profile scale up -d --build
#   → worker-1..worker-6, MAX_SESSIONS=50, benzersiz WORKER_ID
#
# Derleme baglami repo koku (monorepo package-lock + packages/shared).

x-wa-worker: &wa-worker
  build:
    context: ..
    dockerfile: apps/wa-service/Dockerfile
  image: wa-service:local
  env_file:
    - ../apps/wa-service/.env
  environment:
    NODE_ENV: production
    MAX_SESSIONS: '50'
  restart: unless-stopped
  mem_limit: 6g
  shm_size: '1gb'
  stop_grace_period: 45s
  init: true
  healthcheck:
    test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/health']
    interval: 30s
    timeout: 10s
    start_period: 180s
    retries: 3
  logging:
    driver: json-file
    options:
      max-size: '20m'
      max-file: '5'

services:
  # --- Tek node (gelistirme / kucuk kurulum) ---
  # Olcek icin once: docker compose -f infra/docker-compose.yml stop wa-service
  # sonra: docker compose -f infra/docker-compose.yml --profile scale up -d
  wa-service:
    <<: *wa-worker
    container_name: wa-service
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      NODE_ENV: production
      MAX_SESSIONS: '50'
      WORKER_ID: oracle-1

  # --- Olcek profili: 6 x 50 = 300 oturum kapasitesi ---
  # Her instance benzersiz WORKER_ID; ayni id ile iki process acma.
  wa-worker-1:
    <<: *wa-worker
    container_name: wa-worker-1
    profiles: ['scale']
    ports:
      - '127.0.0.1:8081:8080'
    environment:
      NODE_ENV: production
      MAX_SESSIONS: '50'
      WORKER_ID: worker-1

  wa-worker-2:
    <<: *wa-worker
    container_name: wa-worker-2
    profiles: ['scale']
    ports:
      - '127.0.0.1:8082:8080'
    environment:
      NODE_ENV: production
      MAX_SESSIONS: '50'
      WORKER_ID: worker-2

  wa-worker-3:
    <<: *wa-worker
    container_name: wa-worker-3
    profiles: ['scale']
    ports:
      - '127.0.0.1:8083:8080'
    environment:
      NODE_ENV: production
      MAX_SESSIONS: '50'
      WORKER_ID: worker-3

  wa-worker-4:
    <<: *wa-worker
    container_name: wa-worker-4
    profiles: ['scale']
    ports:
      - '127.0.0.1:8084:8080'
    environment:
      NODE_ENV: production
      MAX_SESSIONS: '50'
      WORKER_ID: worker-4

  wa-worker-5:
    <<: *wa-worker
    container_name: wa-worker-5
    profiles: ['scale']
    ports:
      - '127.0.0.1:8085:8080'
    environment:
      NODE_ENV: production
      MAX_SESSIONS: '50'
      WORKER_ID: worker-5

  wa-worker-6:
    <<: *wa-worker
    container_name: wa-worker-6
    profiles: ['scale']
    ports:
      - '127.0.0.1:8086:8080'
    environment:
      NODE_ENV: production
      MAX_SESSIONS: '50'
      WORKER_ID: worker-6

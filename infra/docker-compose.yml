# WhatsApp servisi -- solo / elle scale / autoscale
#
# Repo KOKUNDEN:
#   docker compose -f infra/docker-compose.yml up -d --build
#
# Solo: wa-service (WORKER_ID=oracle-1)
# Elle 6 dilim: --profile scale
# Autoscale: --profile autoscale  (scaler + scale edilebilir wa-worker)
#
# Autoscale actuator=docker icin scaler'a docker.sock mount gerekir;
# varsayilan SCALE_ACTUATOR=noop (yalnizca DB desired yazar).
# Docker CLI: build-arg INSTALL_DOCKER_CLI=true

x-wa-common: &wa-common
  build:
    context: ..
    dockerfile: apps/wa-service/Dockerfile
  image: wa-service:local
  env_file:
    - ../apps/wa-service/.env
  restart: unless-stopped
  mem_limit: 6g
  shm_size: '1gb'
  stop_grace_period: 45s
  init: true
  healthcheck:
    test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/health']
    interval: 30s
    timeout: 10s
    start_period: 180s
    retries: 3
  logging:
    driver: json-file
    options:
      max-size: '20m'
      max-file: '5'

services:
  wa-service:
    <<: *wa-common
    container_name: wa-service
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: oracle-1

  # Sabit 6 dilim (manuel)
  wa-worker-1:
    <<: *wa-common
    container_name: wa-worker-1
    profiles: ['scale']
    ports:
      - '127.0.0.1:8081:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: worker-1
      DB_POOL_MAX: '2'

  wa-worker-2:
    <<: *wa-common
    container_name: wa-worker-2
    profiles: ['scale']
    ports:
      - '127.0.0.1:8082:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: worker-2
      DB_POOL_MAX: '2'

  wa-worker-3:
    <<: *wa-common
    container_name: wa-worker-3
    profiles: ['scale']
    ports:
      - '127.0.0.1:8083:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: worker-3
      DB_POOL_MAX: '2'

  wa-worker-4:
    <<: *wa-common
    container_name: wa-worker-4
    profiles: ['scale']
    ports:
      - '127.0.0.1:8084:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: worker-4
      DB_POOL_MAX: '2'

  wa-worker-5:
    <<: *wa-common
    container_name: wa-worker-5
    profiles: ['scale']
    ports:
      - '127.0.0.1:8085:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: worker-5
      DB_POOL_MAX: '2'

  wa-worker-6:
    <<: *wa-common
    container_name: wa-worker-6
    profiles: ['scale']
    ports:
      - '127.0.0.1:8086:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: worker-6
      DB_POOL_MAX: '2'

  # --- Autoscale: scale edilebilir worker (container_name YOK) ---
  wa-worker:
    <<: *wa-common
    profiles: ['autoscale']
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: auto
      DB_POOL_MAX: '2'

  wa-scaler:
    <<: *wa-common
    container_name: wa-scaler
    profiles: ['autoscale']
    build:
      context: ..
      dockerfile: apps/wa-service/Dockerfile
      args:
        INSTALL_DOCKER_CLI: 'true'
    image: wa-service:local
    ports:
      - '127.0.0.1:8090:8080'
    working_dir: /app
    volumes:
      # docker actuator icin (SCALE_ACTUATOR=docker)
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/app/infra/docker-compose.yml:ro
    environment:
      NODE_ENV: production
      ROLE: scaler
      WORKER_ID: scaler-1
      DB_POOL_MAX: '2'
      SCALE_ACTUATOR: noop
      SCALER_MIN_WORKERS: '1'
      SCALER_MAX_WORKERS: '40'
      SCALER_CAPACITY_PER_WORKER: '50'
      SCALE_COMPOSE_FILE: /app/infra/docker-compose.yml
      SCALE_COMPOSE_SERVICE: wa-worker
      SCALE_COMPOSE_PROJECT: filo-wa
      # SCALE_ACTUATOR=docker icin CLI build-arg ile kurulur; varsayilan noop.
# WhatsApp servisi -- solo / elle scale / autoscale / kucuk VPS
#
# Repo KOKUNDEN (bir profil secin):
#   docker compose -f infra/docker-compose.yml --profile small up -d --build   # 2–4 GB
#   docker compose -f infra/docker-compose.yml --profile solo up -d --build    # orta VPS
#   docker compose -f infra/docker-compose.yml --profile scale up -d --build   # ~32 GB / 300
#   docker compose -f infra/docker-compose.yml --profile autoscale up -d --build
#
# Autoscale actuator=docker icin scaler'a docker.sock mount gerekir;
# varsayilan SCALE_ACTUATOR=noop (yalnizca DB desired yazar).
# Docker CLI: build-arg INSTALL_DOCKER_CLI=true

x-wa-common: &wa-common
  build:
    context: ..
    dockerfile: apps/wa-service/Dockerfile
  image: wa-service:local
  env_file:
    - ../apps/wa-service/.env
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  mem_limit: 6g
  shm_size: '256mb'
  stop_grace_period: 120s
  init: true
  healthcheck:
    test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/ready']
    interval: 30s
    timeout: 10s
    start_period: 180s
    retries: 3
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  # Orta/buyuk VPS solo worker — acik: --profile solo
  wa-service:
    <<: *wa-common
    profiles: ['solo']
    container_name: wa-service
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: oracle-1

  # ~4 GB VPS: tek worker, MAX_SESSIONS=15 (~3.5g mem_limit). 8 GB icin 25 dusunun.
  wa-service-small:
    <<: *wa-common
    profiles: ['small']
    container_name: wa-service
    mem_limit: 3.5g
    shm_size: '128mb'
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      WORKER_ID: hetzner-1
      MAX_SESSIONS: '15'
      DB_POOL_MAX: '2'
      JOB_BATCH_SIZE: '1'
      JOB_POLL_INTERVAL_MS: '3000'
      CAMPAIGN_TICK_MS: '8000'
      SHUTDOWN_DRAIN_MS: '90000'
      NODE_OPTIONS: '--max-old-space-size=2560'

  # Sabit 6 dilim (manuel)
  wa-worker-1:
    <<: *wa-common
    container_name: wa-worker-1
    profiles: ['scale']
    ports:
      - '127.0.0.1:8081:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: worker-1
      DB_POOL_MAX: '2'

  wa-worker-2:
    <<: *wa-common
    container_name: wa-worker-2
    profiles: ['scale']
    ports:
      - '127.0.0.1:8082:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: worker-2
      DB_POOL_MAX: '2'

  wa-worker-3:
    <<: *wa-common
    container_name: wa-worker-3
    profiles: ['scale']
    ports:
      - '127.0.0.1:8083:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: worker-3
      DB_POOL_MAX: '2'

  wa-worker-4:
    <<: *wa-common
    container_name: wa-worker-4
    profiles: ['scale']
    ports:
      - '127.0.0.1:8084:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: worker-4
      DB_POOL_MAX: '2'

  wa-worker-5:
    <<: *wa-common
    container_name: wa-worker-5
    profiles: ['scale']
    ports:
      - '127.0.0.1:8085:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: worker-5
      DB_POOL_MAX: '2'

  wa-worker-6:
    <<: *wa-common
    container_name: wa-worker-6
    profiles: ['scale']
    ports:
      - '127.0.0.1:8086:8080'
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: worker-6
      DB_POOL_MAX: '2'

  # --- Autoscale: scale edilebilir worker (container_name YOK) ---
  wa-worker:
    <<: *wa-common
    profiles: ['autoscale']
    environment:
      NODE_ENV: production
      ROLE: worker
      MAX_SESSIONS: '50'
      WORKER_ID: auto
      DB_POOL_MAX: '2'

  wa-scaler:
    <<: *wa-common
    container_name: wa-scaler
    profiles: ['autoscale']
    build:
      context: ..
      dockerfile: apps/wa-service/Dockerfile
      args:
        INSTALL_DOCKER_CLI: 'true'
    image: wa-service:local
    ports:
      - '127.0.0.1:8090:8080'
    working_dir: /app
    volumes:
      # docker actuator icin (SCALE_ACTUATOR=docker)
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/app/infra/docker-compose.yml:ro
    environment:
      NODE_ENV: production
      ROLE: scaler
      WORKER_ID: scaler-1
      DB_POOL_MAX: '2'
      SCALE_ACTUATOR: noop
      SCALER_MIN_WORKERS: '1'
      SCALER_MAX_WORKERS: '40'
      SCALER_CAPACITY_PER_WORKER: '50'
      SCALE_COMPOSE_FILE: /app/infra/docker-compose.yml
      SCALE_COMPOSE_SERVICE: wa-worker
      SCALE_COMPOSE_PROJECT: filo-wa
      # SCALE_ACTUATOR=docker icin CLI build-arg ile kurulur; varsayilan noop.

  # --- AI Media Control: Orchestration & Validation (Port 3460) ---
  ai-media-control:
    build:
      context: ..
      dockerfile: services/ai-media-control/Dockerfile
    container_name: ai-media-control
    profiles: ['small', 'solo', 'scale']
    restart: unless-stopped
    ports:
      - '127.0.0.1:3460:3460'
    networks:
      - default
      - gflow-internal
    volumes:
      # Shared volumes — same named volumes as gflow-engine for ffprobe/SHA/QA
      - flow-outputs:/shared/outputs
      - flow-incidents:/shared/incidents
    env_file:
      - ../apps/wa-service/.env
    environment:
      NODE_ENV: production
      PORT: '3460'
      GFLOW_ENGINE_URL: 'http://gflow-engine:3461'
      SHARED_OUTPUTS_DIR: '/shared/outputs'
      SHARED_INCIDENTS_DIR: '/shared/incidents'
      CREATIVE_VIDEO_ORCHESTRATOR: 'v1'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3460/health']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # --- GFlow Engine: Isolated Flow Driver (NO Public Ports) ---
  gflow-engine:
    build:
      context: ..
      dockerfile: services/gflow-engine/Dockerfile
    container_name: gflow-engine
    profiles: ['small', 'solo', 'scale']
    restart: unless-stopped
    # NO host ports — not accessible from outside Docker
    networks:
      - gflow-internal       # ai-media-control ↔ gflow-engine private communication
      - gflow-egress         # outbound internet → Google Flow (no inbound)
    volumes:
      - /app/flow-profiles:/app/flow-profiles
      - flow-outputs:/shared/outputs
      - flow-incidents:/shared/incidents
    shm_size: '1gb'
    security_opt:
      - seccomp:./chrome-seccomp.json
    environment:
      FLOW_PROFILES_DIR: '/app/flow-profiles'
      FLOW_OUTPUTS_DIR: '/shared/outputs'
      FLOW_INCIDENTS_DIR: '/shared/incidents'
      GFLOW_CLI_PATH: '/app/upstream_gflow/gflow-cli'
      GFLOW_CHROME_NO_SANDBOX: '0'
      DISPLAY: ':99'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3461/health']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    mem_limit: 4g
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  gflow-internal:
    driver: bridge
    internal: true    # No internet — only container-to-container traffic

  gflow-egress:
    driver: bridge
    # NOT internal — allows outbound internet for Google Flow access
    # No host port binding on gflow-engine → no inbound exposure

volumes:
  flow-outputs:
    driver: local
  flow-incidents:
    driver: local

# Palmate-style channel workers — mock by default
# From repo root:
#   docker compose -f infra/docker-compose.channels.yml up -d --build

x-channel: &channel
  build:
    context: ..
    dockerfile: apps/channel-service.Dockerfile
  restart: unless-stopped
  environment:
    NODE_ENV: production
    MOCK_MODE: 'true'
    LIVE_ENABLED: 'false'
  logging:
    driver: json-file
    options:
      max-size: '5m'
      max-file: '2'

services:
  tg-service:
    <<: *channel
    build:
      context: ..
      dockerfile: apps/channel-service.Dockerfile
      args: { SERVICE: tg-service }
    image: tg-service:local
    container_name: tg-service
    ports: ['127.0.0.1:3101:3101']
    environment:
      PORT: '3101'
      MOCK_MODE: 'true'

  meta-service:

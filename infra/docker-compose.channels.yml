# Palmate-style channel workers — mock by default; sample creds via env_file.
# From repo root:
#   docker compose -f infra/docker-compose.channels.yml up -d --build
#
# LIVE against local vendor sandbox: set API_BASE to sandbox URL + LIVE_ENABLED=true
# DATABASE_URL optional — without it workers run sync HTTP (MOCK_MODE=true).

x-channel: &channel
  build:
    context: ..
    dockerfile: apps/channel-service.Dockerfile
  restart: unless-stopped
  env_file:
    - ../packages/channel-runtime/SAMPLE_CREDENTIALS.env
  environment:
    NODE_ENV: production
    MOCK_MODE: 'true'
    LIVE_ENABLED: 'false'
    ROLE: worker
  logging:
    driver: json-file
    options:
      max-size: '5m'
      max-file: '2'

services:
  tg-service:
    <<: *channel
    build:
      context: ..
      dockerfile: apps/channel-service.Dockerfile
      args: { SERVICE: tg-service }
    image: tg-service:local
    container_name: tg-service
    ports: ['127.0.0.1:3101:3101']
    environment:
      PORT: '3101'
      WORKER_ID: tg-1
      MOCK_MODE: 'true'

  meta-service:
